[project]
name = "signal-trader-demo"
version = "0.1.0"
description = "Local, free, paper-only backtest harness — honest measurement, no edge promise."
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.4.1",
    "backtesting==0.6.5",
    "edgartools==5.36.0",
    "vectorbt==1.0.0",
    "quantstats-reloaded==0.1.0",
    "matplotlib==3.11.0",
    "alpaca-py==0.43.4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "python-dotenv>=1.0,<2",
    "fastapi==0.137.2",
    "uvicorn==0.49.0",
    "lightgbm==4.6.0",
    "pypdf==6.13.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_trader"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
