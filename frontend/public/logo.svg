<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" role="img" aria-label="KIT — Signal Harness">
  <!-- Horizontal KIT wordmark: white K + T, orange I (matches the in-app .hi),
       matchday underline. Geometric, font-independent. -->
  <!-- K -->
  <rect x="6" y="12" width="10" height="48" fill="#15161a"/>
  <path d="M16 36 L37 12 H45 L24 36 Z" fill="#15161a"/>
  <path d="M16 36 L37 60 H45 L24 36 Z" fill="#15161a"/>
  <!-- I (orange accent) -->
  <rect x="60" y="12" width="12" height="48" fill="#ff4d12"/>
  <!-- T -->
  <rect x="86" y="12" width="52" height="10" fill="#15161a"/>
  <rect x="107" y="12" width="10" height="48" fill="#15161a"/>
  <!-- matchday underline + tag -->
  <rect x="6" y="64" width="132" height="4" fill="#ff4d12"/>
  <text x="150" y="44" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#62646e">HARNESS</text>
</svg>
